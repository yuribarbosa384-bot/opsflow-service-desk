name: Feature request
description: Suggest a focused product or technical improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Users can...
        - The API returns...
        - Tests cover...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Queue
        - Kanban
        - Reports
        - API
        - Domain rules
        - Documentation
        - Tooling
